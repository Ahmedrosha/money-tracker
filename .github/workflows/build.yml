name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and copy app code
        run: |
          flutter --version
          flutter create --org com.rashad --project-name money_tracker --platforms android build_app
          rm -rf build_app/lib build_app/test build_app/analysis_options.yaml
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cp -r assets build_app/assets
          python3 ci/patch_android.py
          MANIFEST=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="money_tracker"/android:label="Expense \&amp; Wealth Tracker"/' "$MANIFEST"
          grep -o 'android:label="[^"]*"' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          # Let the app open https links (Dropbox sign-in) on Android 11+.
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"
          # Same signing key on every build so updates install over the old version.
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        working-directory: build_app
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../build.log

      - name: App icon
        working-directory: build_app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: build_app
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../build.log

      - name: Work out version
        run: |
          MM=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+).*/\1/')
          echo "APP_VERSION=$MM.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: build_app
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Check APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$($APKSIGNER verify --print-certs build_app/build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          WANT=$(keytool -list -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK cert: $GOT"; echo "Expected: $WANT"
          $(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2 dump badging build_app/build/app/outputs/flutter-apk/app-release.apk | grep -E "^package|targetSdkVersion" 
          test "$GOT" = "$WANT"

      - name: Build Play Store bundle
        working-directory: build_app
        shell: bash
        env:
          PLAY_UPLOAD: "1"
        run: |
          set -o pipefail
          flutter build appbundle --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Rename APK and bundle
        run: |
          mkdir -p out
          cp build_app/build/app/outputs/flutter-apk/app-release.apk out/money-tracker-$APP_VERSION.apk
          cp build_app/build/app/outputs/bundle/release/app-release.aab out/money-tracker-$APP_VERSION.aab
          # Check the bundle is signed with the upload key.
          jarsigner -verify -verbose -certs out/money-tracker-$APP_VERSION.aab | grep -m1 "O=Money Tracker"

      - uses: actions/upload-artifact@v4
        with:
          name: money-tracker-apk
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Money Tracker ${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/*.apk
            out/*.aab
          make_latest: true

      # Sends the bundle to the Play Store internal testing track.
      # Skipped until the PLAY_SERVICE_ACCOUNT_JSON secret exists.
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rashad.moneytracker
          releaseFiles: out/*.aab
          track: internal
          status: completed
          releaseName: ${{ env.APP_VERSION }}

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI log (latest failure)
          prerelease: true
          files: build.log

