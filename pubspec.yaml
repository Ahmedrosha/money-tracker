name: money_tracker
description: Personal money tracker - accounts, transactions, transfers, multi-currency.
publish_to: 'none'
version: 0.23.3+28

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.0
  http: ^1.2.0
  intl: '>=0.18.0 <1.0.0'
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^10.3.3
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_local_notifications: ^22.3.1
  timezone: any
  local_auth: ^3.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00796B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
