name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and copy app code
        run: |
          flutter --version
          flutter create --org com.rashad --project-name money_tracker --platforms android build_app
          rm -rf build_app/lib build_app/test build_app/analysis_options.yaml
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          MANIFEST=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="money_tracker"/android:label="Money Tracker"/' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          cat "$MANIFEST"
          # Same signing key on every build so updates install over the old version.
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Work out version
        run: |
          MM=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+).*/\1/')
          echo "APP_VERSION=$MM.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp build_app/build/app/outputs/flutter-apk/app-release.apk out/money-tracker-$APP_VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: money-tracker-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Money Tracker ${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
