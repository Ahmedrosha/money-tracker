name: Launch test (emulator)

on:
  workflow_dispatch:
    inputs:
      old:
        description: Older release to update from
        required: false
        default: ''
  push:
    branches: [crashtest]
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern '*.apk' --dir . || \
          gh release download "$(gh release list --repo ${{ github.repository }} --exclude-drafts --limit 5 | grep -m1 '^Money\|v0' | awk -F'\t' '{print $3}')" --repo ${{ github.repository }} --pattern '*.apk' --dir .
          ls -la *.apk
          mkdir -p old new; cp *.apk new/
          OLD="${{ inputs.old }}"
          if [ "${{ github.event_name }}" = push ] && [ -f ci/upgrade_from.txt ]; then OLD=$(cat ci/upgrade_from.txt); fi
          if [ -n "$OLD" ]; then gh release download "$OLD" --repo ${{ github.repository }} --pattern '*.apk' --dir old; fi
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: if ls old/*.apk >/dev/null 2>&1; then bash ci/upgrade_test.sh; else bash ci/launch_test.sh; fi
      - name: Publish log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-crashtest
          name: Emulator launch test
          prerelease: true
          files: |
            run.txt
            logcat.txt
            crash.txt
            screen.png
